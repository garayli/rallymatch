<!DOCTYPE html>
<html lang="tr">
<head>
  <!--

    Must start and end with a slash "/".

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Maça gel! — Tenis Partneri Bul</title>
  <meta name="description" content="Seviyene uygun tenis partneri bul, maç ayarla, sonuçlarını takip et. Maça gel! ücretsiz; telefonuna uygulama olarak da ekleyebilirsin.">
  <meta name="theme-color" content="#1E3A5F">

  <!-- Link previews (WhatsApp, X, Facebook…) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Maça gel!">
  <meta property="og:title" content="Maça gel! — Tenis Partneri Bul">
  <meta property="og:description" content="Seviyene uygun tenis partneri bul, maç ayarla, sonuçlarını takip et.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:locale" content="tr_TR">
  <meta name="twitter:card" content="summary">

  <!-- iOS: "Ana Ekrana Ekle" -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Maça gel!">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #F5F0E8; }
    @media (prefers-color-scheme: dark) { html, body { background: #0A1220; } }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      transition: opacity .25s ease;
    }
    #splash img { width: 96px; height: 96px; }
    #splash .bar {
      width: 72px; height: 3px; border-radius: 2px; overflow: hidden;
      background: rgba(30, 58, 95, .18);
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: #D9A441; animation: slide 1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>

  <!--
    Install bridge for lib/services/pwa_install_web.dart. Chrome/Edge/Android
    fire `beforeinstallprompt` early — often before Flutter has loaded — so it
    is captured here and replayed when Dart asks for it.
  -->
  <script>
    (function () {
      var deferred = null;
      function notify() { if (window.rallyOnInstallChange) window.rallyOnInstallChange(); }
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferred = e;
        notify();
      });
      window.addEventListener('appinstalled', function () { deferred = null; notify(); });
      window.rallyPwa = {
        canPrompt: function () { return deferred !== null; },
        isStandalone: function () {
          return window.matchMedia('(display-mode: standalone)').matches ||
                 window.navigator.standalone === true;
        },
        // iOS has no install prompt; users add via Safari's Share menu.
        isIos: function () {
          var ua = window.navigator.userAgent;
          return /iPhone|iPad|iPod/.test(ua) ||
                 (ua.indexOf('Macintosh') !== -1 && navigator.maxTouchPoints > 1);
        },
        // Resolves to true when the user accepts the browser's install dialog.
        prompt: function () {
          if (!deferred) return Promise.resolve(false);
          var e = deferred;
          deferred = null;
          e.prompt();
          return e.userChoice.then(function (c) { notify(); return c.outcome === 'accepted'; });
        }
      };
    })();
  </script>
</head>
<body>
  <div id="splash" aria-label="Maça gel! yükleniyor">
    <img src="icons/Icon-192.png" alt="Maça gel!">
    <div class="bar"></div>
  </div>
  <noscript>Maça gel!'i kullanmak için JavaScript'i etkinleştir.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
